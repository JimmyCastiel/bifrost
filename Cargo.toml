[package]
name = "bifrost"
version = "0.1.0"
edition = "2024"
default-run = "bifrost"

[dependencies]
thiserror = "2.0.18"
#tokio = { version = "1.52.1", features = ["io-std", "net", "macros", "rt-multi-thread", "signal", "time", "tracing"] }
#tokio-util = { version = "0.7.18", features = ["codec", "io-util", "rt"] }
#ctrlc = "3.5.1"
libc = "0.2.177"
#nix = "0.30.1"
#num-derive = "0.4.2"
#num-traits = "0.2.19"
#polling = "3.11.0"

#[[bin]]
#name = "bifrost"
#path = "src/main.rs"

#[[bin]]
#name = "bifrost-sync"
#path = "src/main-sync.rs"

#[[bin]]
#name = "bifrost-kq"
#path = "src/main-kq.rs"

[[bin]]
name = "bifrost-kq-multi"
path = "src/main-kq-multi.rs"

#[[bin]]
#name = "bifrost-client"
#path = "src/client.rs"
